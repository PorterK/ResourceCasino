name: Build, Test & Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  MC_VERSION: "26.3"

jobs:
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build JAR and run unit tests
        run: |
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log

      - name: Summarize build failure
        if: failure()
        run: |
          # Surface the important lines as a single annotation (readable without log access).
          msg=$(grep -E "error:|warning: \[|FAILED|What went wrong|Could not|> |expected|Exception|AssertionFailed|at net\.kalob" build.log \
                | grep -v "^> Task" | head -n 80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build failed::${msg}"

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: build/reports/tests/

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResourceCasino
          path: build/libs/ResourceCasino-*.jar
          if-no-files-found: error

  server-test:
    name: Live server test on Paper 26.3
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Download plugin JAR
        uses: actions/download-artifact@v4
        with:
          name: ResourceCasino
          path: server/plugins

      - name: Download Paper ${{ env.MC_VERSION }}
        working-directory: server
        run: |
          UA="ResourceCasino-CI (https://github.com/${GITHUB_REPOSITORY})"
          BUILD_JSON=$(curl -fsSL -H "User-Agent: ${UA}" \
            "https://fill.papermc.io/v3/projects/paper/versions/${MC_VERSION}/builds/latest")
          URL=$(echo "$BUILD_JSON" | jq -r '.downloads."server:default".url')
          SHA=$(echo "$BUILD_JSON" | jq -r '.downloads."server:default".checksums.sha256')
          echo "Paper build: $(echo "$BUILD_JSON" | jq -r '.id') ($(echo "$BUILD_JSON" | jq -r '.channel'))"
          curl -fsSL -H "User-Agent: ${UA}" -o paper.jar "$URL"
          echo "${SHA}  paper.jar" | sha256sum -c -

      - name: Configure test server
        working-directory: server
        run: |
          echo "eula=true" > eula.txt
          cat > server.properties <<'EOF'
          online-mode=false
          level-type=minecraft\:flat
          generate-structures=false
          spawn-protection=0
          view-distance=4
          simulation-distance=4
          max-players=1
          EOF

      - name: Run server with self-test
        working-directory: server
        run: |
          set +e
          timeout 900 java -Xms1G -Xmx2G -Dresourcecasino.selftest=true -jar paper.jar --nogui < /dev/null
          echo "server exit code: $?"
          exit 0

      - name: Check results
        working-directory: server
        run: |
          fail=0
          echo "::group::Self-test report"
          cat plugins/ResourceCasino/selftest-result.txt || true
          echo "::endgroup::"

          if ! head -n1 plugins/ResourceCasino/selftest-result.txt 2>/dev/null | grep -qx PASS; then
            echo "::error::Self-test did not pass"; fail=1
          fi
          if ! grep -q "Enabling ResourceCasino" logs/latest.log; then
            echo "::error::Plugin never enabled"; fail=1
          fi
          if grep -nE "at net\.kalob\.ResourceCasino|Error occurred while enabling ResourceCasino|Could not load .*ResourceCasino" logs/latest.log; then
            echo "::error::Plugin errors found in server log"; fail=1
          fi
          if [ -d crash-reports ] && [ -n "$(ls -A crash-reports)" ]; then
            echo "::error::Server crashed"; ls crash-reports; fail=1
          fi
          if [ $fail -ne 0 ]; then
            msg=$( { cat plugins/ResourceCasino/selftest-result.txt 2>/dev/null; \
                     grep -nE "ResourceCasino|ERROR|Exception|at net\.kalob" logs/latest.log | head -n 60; } \
                   | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Server test failed::${msg}"
          else
            msg=$(sed 's/%/%25/g' plugins/ResourceCasino/selftest-result.txt | awk '{printf "%s%%0A", $0}')
            echo "::notice title=Self-test report::${msg}"
          fi
          exit $fail

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-logs
          path: |
            server/logs/
            server/crash-reports/
            server/plugins/ResourceCasino/selftest-result.txt
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: [build, server-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Download plugin JAR
        uses: actions/download-artifact@v4
        with:
          name: ResourceCasino
          path: dist

      # Every push to main refreshes the "latest" release so there's always a
      # stable download link: /releases/download/latest/ResourceCasino.jar
      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp dist/ResourceCasino-*.jar dist/ResourceCasino.jar
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/ResourceCasino.jar \
            --target "${GITHUB_SHA}" \
            --title "Latest build" \
            --notes "Automatic build of \`main\` at ${GITHUB_SHA::7}, tested on a live Paper ${MC_VERSION} server. Needs Paper ${MC_VERSION} on Java 25. Drop the JAR into your server's \`plugins\` folder." \
            --latest

      # Pushing a tag like v1.0.0 creates a permanent versioned release.
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/ResourceCasino-*.jar \
            --title "ResourceCasino ${GITHUB_REF_NAME}" \
            --generate-notes
